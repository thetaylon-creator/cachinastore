<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - CachinaStore Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #0f0c1b;
      color: #fff;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .contenedor {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    .subtitulo {
      color: #a09cb0;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .caja-clave {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .caja-clave input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a2640;
      background: #181528;
      color: #fff;
      outline: none;
    }
    .caja-clave button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .caja-clave button:hover { background: #574b90; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #181528;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      font-size: 0.9rem;
    }
    th {
      background: #131021;
      color: #a09cb0;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    tr:not(:last-child) td {
      border-bottom: 1px solid #2a2640;
    }
    .total {
      color: #00ffaa;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .mensaje {
      color: #ff6b6b;
      margin-top: 15px;
    }
    .vacio {
      text-align: center;
      color: #71717a;
      padding: 30px;
    }
    .btn-eliminar {
  background: #ff4757;
  border: none;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
}
.btn-eliminar:hover { background: #e63946; }
.btn-eliminar:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>👥 Usuarios registrados</h1>
    <p class="subtitulo">CachinaStore — Panel de administración</p>

    <div class="caja-clave">
      <input type="password" id="clave-admin" placeholder="Ingresa tu clave de administrador">
      <button id="btn-ver">Ver usuarios</button>
    </div>

    <p class="total" id="total-usuarios"></p>
    <div id="resultado"></div>
  </div>

  <script>
    const btnVer = document.getElementById('btn-ver');
    const inputClave = document.getElementById('clave-admin');
    const resultado = document.getElementById('resultado');
    const totalTexto = document.getElementById('total-usuarios');

    async function cargarUsuarios() {
      const clave = inputClave.value.trim();
      if (!clave) return;

      resultado.innerHTML = '<p class="vacio">Cargando...</p>';
      totalTexto.textContent = '';

      try {
        // FIX: se agrega cache: 'no-store' para que el navegador
        // siempre pida la lista fresca al servidor. Sin esto, después
        // de eliminar un usuario, el navegador a veces devolvía la
        // respuesta anterior guardada en caché y la tabla no se
        // actualizaba hasta refrescar la página manualmente.
        const respuesta = await fetch(`/api/admin/usuarios?key=${encodeURIComponent(clave)}`, {
          cache: 'no-store'
        });
        const datos = await respuesta.json();

        if (!respuesta.ok) {
          resultado.innerHTML = `<p class="mensaje">${datos.error || 'Error al cargar usuarios'}</p>`;
          return;
        }

        if (datos.usuarios.length === 0) {
          totalTexto.textContent = 'Total: 0 usuario(s)';
          resultado.innerHTML = '<p class="vacio">Aún no hay usuarios registrados</p>';
          return;
        }

        totalTexto.textContent = `Total: ${datos.total} usuario(s)`;

        // FIX: se ordena explícitamente por fecha de creación (más
        // reciente primero) antes de numerar, para garantizar que el
        // ID 1 sea siempre el usuario registrado más recientemente,
        // sin depender del orden en que lo devuelva el servidor.
        const usuariosOrdenados = [...datos.usuarios].sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );

        let filas = '';
        usuariosOrdenados.forEach((u, index) => {
          const fecha = new Date(u.created_at).toLocaleString('es-PE', {
            dateStyle: 'medium',
            timeStyle: 'short'
          });
          // Número correlativo (1, 2, 3...) en vez del ID real de la
          // base de datos, que deja huecos al eliminar usuarios.
          filas += `<tr data-fila-usuario="${u.user_code}"><td>${index + 1}</td><td>${u.user_code}</td><td>${fecha}</td><td><button class="btn-eliminar" data-usuario="${u.user_code}">Eliminar</button></td></tr>`;
        });

        resultado.innerHTML = `
          <table>
            <thead>
              <tr><th>ID</th><th>Usuario</th><th>Registrado</th><th></th></tr>
            </thead>
            <tbody>${filas}</tbody>
          </table>
        `;
      } catch (error) {
        resultado.innerHTML = '<p class="mensaje">No se pudo conectar al servidor</p>';
      }
    }

    btnVer.addEventListener('click', cargarUsuarios);
    inputClave.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') cargarUsuarios();
    });

    resultado.addEventListener('click', async (e) => {
      const boton = e.target.closest('.btn-eliminar');
      if (!boton) return;

      const usuario = boton.getAttribute('data-usuario');
      const clave = inputClave.value.trim();

      if (!confirm(`¿Seguro que quieres eliminar al usuario "${usuario}"?`)) return;

      // FIX: se deshabilita el botón mientras se procesa, para evitar
      // doble clic y dejar claro que la acción está en curso.
      boton.disabled = true;
      boton.textContent = 'Eliminando...';

      try {
        const respuesta = await fetch(`/api/admin/usuarios/${encodeURIComponent(usuario)}?key=${encodeURIComponent(clave)}`, {
          method: 'DELETE',
          cache: 'no-store'
        });
        const datos = await respuesta.json();

        if (!respuesta.ok) {
          alert(datos.error || 'No se pudo eliminar');
          boton.disabled = false;
          boton.textContent = 'Eliminar';
          return;
        }

        // FIX: actualización inmediata (optimista) — se quita la fila
        // de la pantalla al instante en vez de esperar solo a
        // cargarUsuarios(), así se ve el cambio de inmediato aunque
        // la recarga desde el servidor tarde un poco.
        const fila = resultado.querySelector(`tr[data-fila-usuario="${CSS.escape(usuario)}"]`);
        fila?.remove();

        const filasRestantes = resultado.querySelectorAll('tbody tr').length;
        totalTexto.textContent = `Total: ${filasRestantes} usuario(s)`;

        // Igual se vuelve a pedir la lista real al servidor (ya sin
        // caché) para asegurar que quede exactamente sincronizada.
        cargarUsuarios();
      } catch (error) {
        alert('Error de conexión al eliminar');
        boton.disabled = false;
        boton.textContent = 'Eliminar';
      }
    });
  </script>
</body>
</html>
