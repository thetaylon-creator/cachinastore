<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa - CachinaStore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
:root{--bg-dark:#0b0716;--bg-card:#1a1233;--border-color:rgba(255,255,255,.1);--text-muted:#a99fc9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-dark);color:#fff;min-height:100dvh;font-family:Inter,'Segoe UI',system-ui,sans-serif}
#pantalla-bienvenida{display:block;min-height:100dvh;text-align:left;background:var(--bg-dark)}

.lx-nav{position:sticky;top:0;z-index:50;height:65px;background:#0d0819;border-bottom:1px solid var(--border-color)}
.lx-nav-in{max-width:1070px;margin:0 auto;height:100%;display:flex;align-items:center;gap:28px;padding:0 16px}
.lx-logo{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:cover}
.lx-links{display:flex;gap:28px}
.lx-links a{color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500}
.lx-links a:hover{color:#fff}
.lx-sp{flex:1}
.lx-moneda{display:flex;align-items:center;gap:7px;border:1px solid var(--border-color);border-radius:10px;padding:8px 11px;font-size:13px;color:#fff}
.lx-moneda small{font-size:11px;color:var(--text-muted)}
.lx-flag{width:18px;height:13px;border-radius:2px;background:linear-gradient(90deg,#d91023 33%,#fff 33% 66%,#d91023 66%)}

.lx-btn{display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 20px;border-radius:10px;font-weight:700;font-size:15px;color:#fff;border:1px solid transparent;background:none;cursor:pointer;text-decoration:none;font-family:inherit}
.lx-btn-pri{background:#7c3aed;box-shadow:0 0 0 1px rgba(167,139,250,.5)}
.lx-btn-pri:hover{background:#6d28d9}
.lx-btn-sec{border-color:rgba(167,139,250,.55)}
.lx-btn-sec:hover{background:rgba(167,139,250,.12)}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:'liga'}
.lx-nav .lx-btn{height:44px;font-size:14px;padding:0 18px}

.lx-hero{position:relative;min-height:560px;overflow:hidden;background:linear-gradient(180deg,#2a1a52 0%,#5b21b6 55%,var(--bg-dark) 100%)}
.lx-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 100% 60%,rgba(124,58,237,.55),transparent 55%)}
.lx-hero-in{position:relative;max-width:1070px;margin:0 auto;padding:0 16px;min-height:520px;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.lx-title{font-size:clamp(64px,10vw,96px);font-weight:900;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(90deg,#c4b5fd 0%,#6d4bd1 45%,#3b2a6b 62%,#f0b429 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(167,139,250,.5))}
.lx-sub{font-size:26px;font-weight:700;margin:26px 0 30px;color:#cfc6ee}
.lx-sub b{color:#f0b429}
#palabra-rotativa{display:inline-block;transition:opacity .4s ease,transform .4s ease}
#palabra-rotativa.saliendo{opacity:0;transform:translateY(8px)}
.lx-cta{display:flex;gap:14px;flex-wrap:wrap}
.lx-art{justify-self:center;width:min(100%,475px);aspect-ratio:1;border-radius:50%;margin-top:-80px;
  background:rgba(255,255,255,.14) url('fondo-bienvenida.jpg') center/cover no-repeat;
  box-shadow:0 0 60px rgba(124,58,237,.35)}

.lx-trust{max-width:1070px;margin:0 auto;padding:64px 16px 90px;text-align:center}
.lx-trust h2{display:inline-flex;align-items:center;gap:12px;font-size:30px;margin-bottom:10px}
.lx-shield{width:42px;height:42px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border-color);display:grid;place-items:center;color:#a78bfa;font-size:20px}
.lx-trust p{color:var(--text-muted);max-width:560px;margin:0 auto}

@media (max-width:820px){
  .lx-links,.lx-moneda{display:none}
  .lx-hero-in{grid-template-columns:1fr;padding:48px 16px}
  .lx-art{margin-top:24px}
  .lx-sub{font-size:22px}
}
</style>
</head>
<body>
<section id="pantalla-bienvenida">
  <nav class="lx-nav">
    <div class="lx-nav-in">
      <img src="logo.png" alt="CachinaStore" class="lx-logo">
      <div class="lx-sp"></div>
      <div class="lx-moneda"><small>Moneda:</small><span class="lx-flag"></span><b>PEN</b></div>
      <button class="lx-btn lx-btn-pri" id="btn-entrar">⇥ Iniciar Sesión</button>
    </div>
  </nav>

  <header class="lx-hero">
    <div class="lx-hero-in">
      <div>
        <h1 class="lx-title">CACHINA STORE</h1>
        <p class="lx-sub">Adquiere <b id="palabra-rotativa">skins</b></p>
        <div class="lx-cta">
          <button class="lx-btn lx-btn-pri"><span class="material-symbols-rounded">sports_esports</span>Tienda Fortnite</button>      
        </div>
      </div>
      <div class="lx-art" role="img" aria-label="CachinaStore"></div>
    </div>
  </header>

  <section class="lx-trust">
    <h2><span class="lx-shield">⛨</span>¿Somos confiables?</h2>
    <p>Años de experiencia, pagos protegidos y soporte real cuando lo necesitas.</p>
  </section>
</section>
    </section>
</section>

<script>
(function () {
  const palabras = ['skins', 'pavos', 'bailes', 'picos', 'mochilas', 'planeadores', 'envoltorios', 'pase de batalla', 'club Fortnite', 'packs'];
  const el = document.getElementById('palabra-rotativa');
  if (!el) return;

  let i = 0;
  setInterval(() => {
    el.classList.add('saliendo');
    setTimeout(() => {
      i = (i + 1) % palabras.length;
      el.textContent = palabras[i];
      el.classList.remove('saliendo');
    }, 400);
  }, 5000);
})();
</script>
</body>
</html>
</body>
</html>
